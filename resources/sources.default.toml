# Shadow Tentacles — sources
#
# Yours to edit and meant to be shared. Delete what you do not read, add what
# you do.
#
#   kind = "rss"        a feed: RSS, Atom or JSON Feed
#   kind = "json_api"   any service answering with JSON; needs [source.map]
#   kind = "html_list"  a listing page for a site with no feed
#
# A source is reached three ways, used together. `url` is its feed: the last day
# or two, carrying the summary the publisher wrote. Its sitemap is the complete
# answer, with dates, and the news maps carry headlines as well; it is found
# through robots.txt, and `sitemap_url` points at one that is not listed there.
# An empty `sitemap_url` says the publisher has none and stops the search.
# `search_url` is for the few sources that can be asked a question directly.
#
# An address may carry {query}, {days}, {min_points}, {since}, {until},
# {since_date} and {until_date}. They are filled from the settings before the
# request, so the service does the filtering instead of this program discarding
# the results afterwards.

[settings]
ui_lang = "en"
output_lang = "en"
keywords = []
collect_days = 3
summarize_limit = 30

