# ───────────────────── Services, as configuration ─────────────────────

# Hacker News through its search API. The score and date bounds go into the
# address so the service applies them, the discussion link is built from the
# item's id, and a post with no outbound link (Ask HN, Show HN) points at its
# own thread.
[[source]]
kind = "json_api"
title = "Hacker News"
url = "https://hn.algolia.com/api/v1/search_by_date?tags=story&hitsPerPage=50&query={query}&numericFilters=points%3E{min_points}%2Ccreated_at_i%3E{since}"
lang = "en"
min_points = 100

[source.map]
items = "hits"
url = "url"
title = "title"
published = "created_at_i"
score = "points"
comments = "num_comments"
excerpt = "story_text"
discussion_template = "https://news.ycombinator.com/item?id={objectID}"
url_from_discussion = true

# A plain JSON service, to show how little it takes.
[[source]]
kind = "json_api"
title = "Lobsters"
url = "https://lobste.rs/newest.json"
lang = "en"
enabled = false

[source.map]
url = "url"
title = "title"
published = "created_at"
score = "score"
comments = "comment_count"
discussion = "comments_url"
